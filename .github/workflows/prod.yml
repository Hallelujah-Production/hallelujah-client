name: Deploy Frontend

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: [self-hosted, prod-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync frontend
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ /mpower/hallelujah-client/

      - name: Install dependencies
        working-directory: /mpower/hallelujah-client
        run: npm ci

      - name: Build frontend
        working-directory: /mpower/hallelujah-client
        run: npm run build

      - name: Restart frontend
        run: |
          pm2 restart frontend
          pm2 save

      - name: Verify frontend
        run: pm2 status frontend
